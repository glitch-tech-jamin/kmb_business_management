<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | KMB Business Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="logo">KMB Business Management</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="customers.html">Customers</a>
      <a href="products.html" class="active">Products</a>
      <a href="invoices.html">Invoices</a>
    </nav>
  </header>

  <main class="page-content">
    <section>
      <h1>Products</h1>
      <form id="product-form" class="form-row">
        <input id="product-name" placeholder="Product name" required>
        <input id="product-description" placeholder="Description">
        <input id="product-purchase" type="number" step="0.01" placeholder="Purchase amount" required>
        <input id="product-transport" type="number" step="0.01" placeholder="Transport cost" required>
        <input id="product-price" type="number" step="0.01" placeholder="Sell price (auto-calculated)" >
        <button type="submit">Add Product</button>
      </form>
      <div id="product-suggestion" class="message"></div>
      <div id="product-message" class="message"></div>
      <div class="table-wrapper">
        <table id="product-table">
          <thead>
            <tr><th>Name</th><th>Description</th><th>Cost total</th><th>Sell price</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">Static KMB app built for DecSoft.</footer>
</body>
</html>
